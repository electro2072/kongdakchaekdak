# Docker/MySQL 없이 로컬에서 빠르게 실행 확인할 때 쓰는 프로필.
# 실행: gradle bootRun --args="--spring.profiles.active=local"  (또는 ./gradlew 로 wrapper 사용 시 동일)
spring:
  datasource:
    url: jdbc:h2:mem:kongdakchaekdak;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
