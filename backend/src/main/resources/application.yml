server:
  port: 8080

spring:
  application:
    name: reading-record-app-backend
  datasource:
    url: jdbc:mysql://localhost:3306/reading_record_app?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # 운영 배포 전 반드시 JWT_SECRET 환경변수로 교체할 것 (HS256 요구사항: UTF-8 기준 32바이트 이상).
    secret: ${JWT_SECRET:please-change-this-dev-only-jwt-secret-before-deploying}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  # 소셜 로그인(카카오/구글/네이버) Client ID/Secret. 실제 값은 절대 여기에 직접 쓰지 말고
  # backend/.env 파일(git에 커밋되지 않음)에 KAKAO_CLIENT_ID=... 형태로 넣을 것 —
  # build.gradle.kts의 bootRun 설정이 .env를 읽어 환경변수로 넘겨준다.
  oauth2:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
  # 책 사진(BookPhoto) 업로드용 S3 설정. 실제 값은 절대 여기에 직접 쓰지 말고 backend/.env에
  # AWS_S3_BUCKET=... 형태로 넣을 것 (.env.example 참고). accessKey/secretKey가 비어 있어도
  # 서버 기동 자체는 되지만, 실제 presigned URL 발급(사진 업로드) 시점에 실패한다.
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presigned-url-expiration-seconds: ${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:600}
