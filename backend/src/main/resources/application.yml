server:
  port: 8080

spring:
  application:
    name: reading-record-app-backend
  datasource:
    url: jdbc:mysql://localhost:3306/reading_record_app?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # 운영 배포 전 반드시 JWT_SECRET 환경변수로 교체할 것 (HS256 요구사항: UTF-8 기준 32바이트 이상).
    secret: ${JWT_SECRET:please-change-this-dev-only-jwt-secret-before-deploying}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
