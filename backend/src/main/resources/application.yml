server:
  # Step 6(배포, Railway): Railway는 컨테이너에 PORT 환경변수를 주입하고 그 포트로 리슨해야
  # 외부에서 접속 가능하다(플랫폼이 임의로 포트를 배정함). 로컬 개발/Docker Compose 환경에는
  # PORT가 없으니 기존 기본값 8080을 그대로 씀 — 로컬 실행 방식은 전혀 안 바뀐다.
  port: ${PORT:8080}

spring:
  application:
    name: kongdakchaekdak-backend
  jackson:
    # (OBS-26, 2026-09-10) 서비스 타임존은 KST(Asia/Seoul) 고정 — Jackson이 날짜/시간 관련 값을
    # 다룰 때(예: 향후 zone 정보를 포함한 타입을 응답에 추가하게 될 경우) 기본으로 삼는 타임존도
    # 맞춰둔다. 실질적인 방어선은 common.time.KstClock과 KongdakchaekdakApplication의 JVM 기본
    # 타임존 고정이고, 이건 그 의도를 설정에도 명시해두는 것.
    time-zone: Asia/Seoul
  datasource:
    # Step 6(배포, Railway): 호스트/포트/DB명을 분리해서 환경변수로 받도록 바꿈 — 로컬은 기존과
    # 동일하게 docker-compose의 localhost:3306/kongdakchaekdak을 기본값으로 그대로 쓰고,
    # Railway에서는 MySQL 플러그인의 MYSQLHOST/MYSQLPORT/MYSQLDATABASE 값을 이 서비스의
    # DB_HOST/DB_PORT/DB_NAME 변수에 참조 변수(${{MySQL.MYSQLHOST}} 등)로 연결해서 씀
    # (DB_USERNAME/DB_PASSWORD는 기존 변수명을 그대로 재사용, MYSQLUSER/MYSQLPASSWORD를 참조).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kongdakchaekdak}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mvc:
    # (BUG-20260910-b02, 2026-09-10) 기본값(false)이면 매핑되지 않은 라우트로 온 요청을 서블릿
    # 컨테이너가 직접 처리해버려(NoHandlerFoundException을 던지지 않음) GlobalExceptionHandler를
    # 아예 거치지 않는다 — 이 프로젝트가 응답 포맷을 항상 공통 ErrorResponse로 통일하는 것과
    # 어긋나므로 true로 켠다. 아래 add-mappings: false와 반드시 같이 있어야 실제로 예외가 던져진다
    # (정적 리소스 핸들러가 "/**"에 대한 폴백 핸들러로 항상 매칭돼버리면 "핸들러가 없다"는 상황
    # 자체가 발생하지 않는다).
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 이 백엔드는 REST API 전용이고(정적 파일 서빙 없음, 공개 웹뷰는 Thymeleaf 템플릿 렌더링이라
      # classpath:/static 등과 무관), springdoc의 swagger-ui 정적 리소스(/webjars/**)는 springdoc이
      # 자체 WebMvcConfigurer로 별도 등록하므로 이 설정과 무관하게 계속 서빙된다 — 그래도 배포 후
      # Swagger UI(/swagger-ui.html)가 정상 로드되는지는 한 번 직접 확인 권장.
      add-mappings: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # 운영 배포 전 반드시 JWT_SECRET 환경변수로 교체할 것 (HS256 요구사항: UTF-8 기준 32바이트 이상).
    secret: ${JWT_SECRET:please-change-this-dev-only-jwt-secret-before-deploying}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  # 소셜 로그인(카카오/구글/네이버) Client ID/Secret. 실제 값은 절대 여기에 직접 쓰지 말고
  # backend/.env 파일(git에 커밋되지 않음)에 KAKAO_CLIENT_ID=... 형태로 넣을 것 —
  # build.gradle.kts의 bootRun 설정이 .env를 읽어 환경변수로 넘겨준다.
  oauth2:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    # 애플은 client-secret이 없다 — clientId도 실제로는 iOS 앱의 Bundle ID다(다른 3사의
    # Client ID와 발급 방식/용도가 다름). 상세: AppleOAuthProperties, .env.example 주석.
    apple:
      client-id: ${APPLE_CLIENT_ID:}
  # 책 사진(BookPhoto) 업로드용 S3 설정. 실제 값은 절대 여기에 직접 쓰지 말고 backend/.env에
  # AWS_S3_BUCKET=... 형태로 넣을 것 (.env.example 참고). accessKey/secretKey가 비어 있어도
  # 서버 기동 자체는 되지만, 실제 presigned URL 발급(사진 업로드) 시점에 실패한다.
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presigned-url-expiration-seconds: ${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS:600}
  # Step 5-2: 비로그인 공개 공유 웹뷰(/public/share/{token})용 설정. base-url은 OG 메타태그의
  # og:url/절대경로 og:image를 만들 때 쓰는 이 서버의 공개 도메인
  # default-og-image-url은 카드 이미지(cardImageUrl)도, 책 표지도 없을 때 쓸 고정 OG 이미지인데 아직 디자인 에셋이
  # 없어 기본값은 빈 문자열 — 비어 있으면 템플릿에서 og:image 태그 자체를 생략한다.
  public-web:
    base-url: ${PUBLIC_BASE_URL:https://kongdakchaekdak-production.up.railway.app}
    default-og-image-url: ${PUBLIC_DEFAULT_OG_IMAGE_URL:}
