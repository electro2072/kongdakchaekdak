# 테스트 실행 전용 설정: MySQL/Docker 없이 H2 인메모리로 테스트를 돌린다.
spring:
  datasource:
    url: jdbc:h2:mem:kongdakchaekdak_test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: test-only-jwt-secret-value-not-used-in-production-32bytes
    expiration-seconds: 3600
  # 테스트에서는 KakaoOAuthClient/GoogleOAuthClient/NaverOAuthClient를 전부 @MockBean으로 대체하므로
  # 실제 값이 필요 없다 — 프로퍼티 바인딩이 비어있어도 컨텍스트 로딩에는 문제없음을 명시적으로 남겨둔다.
  oauth2:
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret
    naver:
      client-id: test-naver-client-id
      client-secret: test-naver-client-secret
  # S3Presigner는 실제 AWS에 네트워크 요청을 보내지 않고 로컬에서 서명만 계산하므로,
  # 아래 더미 값으로도 presigned URL 발급 테스트가 (실제 AWS 접근 없이) 정상적으로 동작한다.
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    access-key: test-access-key
    secret-key: test-secret-key-value-not-real
    presigned-url-expiration-seconds: 600
  public-web:
    base-url: http://localhost:8080
    default-og-image-url: ""
