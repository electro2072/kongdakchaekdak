name: Backend Tests

# backend/ 폴더가 바뀔 때마다(push, PR 모두) 실제로 gradle test를 돌려서
# 컴파일 에러·테스트 회귀를 자동으로 잡는다. 클라우드 세션(claude.ai)은
# Maven Central/Gradle Plugin Portal에 네트워크 접근이 막혀 있어 이걸 대신
# 못 하기 때문에, 코드 리뷰만으로 넘어갔던 회귀(예: 2026-08-27 컴파일 에러,
# 2026-08-27 테스트 스위트 컴파일 실패)를 여기서 대신 잡기 위해 추가함.
#
# Gradle Wrapper(gradlew)가 저장소에 커밋되어 있으므로 wrapper로 실행한다
# (프로젝트가 지정한 Gradle 버전을 그대로 써서 로컬 실행과 100% 동일하게 맞춰짐).

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (wrapper 캐싱)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run gradle test
        run: ./gradlew test --no-daemon

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 14
